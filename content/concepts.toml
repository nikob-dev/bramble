# The Ledgers track. Order matters only to break ties: prerequisites always come first.

[[concepts]]
id = "money-is-rows"
title = "Money is rows"
track = "ledgers"
objectives = [
    "Explain an account balance as the sum of its postings",
    "Query a balance directly from the ledger with SQL",
    "Explain why a customer deposit is a liability on the bank's books",
]

[[concepts]]
id = "double-entry"
title = "Double-entry"
track = "ledgers"
prereqs = ["money-is-rows"]
objectives = [
    "Post a balanced transfer through a payments API",
    "Predict why an unbalanced entry is rejected, in code and in the database",
    "Prove the books balance: every posting sums to zero",
]

[[concepts]]
id = "idempotency"
title = "Idempotency"
track = "ledgers"
prereqs = ["double-entry"]
objectives = [
    "Find a duplicate charge in the ledger",
    "Retry a payment safely with an idempotency key",
    "Fix a mistake with a reversing entry instead of an edit",
]

[[concepts]]
id = "reconciliation"
title = "Reconciliation"
track = "ledgers"
prereqs = ["double-entry"]
objectives = [
    "Compare a counterparty's settlement report against the ledger",
    "Find and name the entry behind a break",
]

[[concepts]]
id = "hashing-signatures"
title = "Hashing & signatures"
track = "ledgers"
prereqs = ["money-is-rows"]
objectives = [
    "Verify a payment file's integrity with SHA-256",
    "Verify who signed a payment file with an Ed25519 signature",
    "Explain what a hash proves and what only a signature proves",
]

# The Rails track: how money moves between banks (M4). Needs three banks and the operator
# running (`make play` starts them).

[[concepts]]
id = "instant-payments"
title = "Instant payments (RTP)"
track = "rails"
prereqs = ["double-entry", "idempotency"]
objectives = [
    "Explain why banks hold reserves at an operator instead of paying each other directly",
    "Send an instant payment to another bank and see three sets of books change",
    "Explain what settlement finality means for the sender",
]

[[concepts]]
id = "batch-payments"
title = "Batch payments (ACH)"
track = "rails"
prereqs = ["double-entry"]
objectives = [
    "Queue an ACH payment and explain why reserves don't move yet",
    "Read a Nacha file: which record carries one payment",
    "Run a cutoff and confirm the clearing account empties",
]

[[concepts]]
id = "netting"
title = "Netting & settlement"
track = "rails"
prereqs = ["batch-payments"]
objectives = [
    "Compute a bank's net position from its gross flows",
    "Find the single settlement entry behind several payments",
    "Explain the liquidity trade-off between gross and net settlement",
]

[[concepts]]
id = "interbank-reconciliation"
title = "Cross-bank reconciliation"
track = "rails"
prereqs = ["reconciliation", "instant-payments"]
objectives = [
    "Reconcile the bank's reserves against the operator's statement",
    "Find the entry behind a break between two banks' books",
    "Fix the break with a reversing entry and prove the books agree",
]

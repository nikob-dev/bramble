services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    profiles: ["dev"]

  pet-a:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: bramble:dev
    command: ["node"]
    environment:
      BRAMBLE_PET_NAME: pip
    ports:
      - "${BRAMBLE_PET_A_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
    env_file:
      - path: .env
        required: false
    volumes:
      - pet-a-data:/var/lib/bramble

volumes:
  cargo-registry:
  cargo-target:
  pet-a-data:
